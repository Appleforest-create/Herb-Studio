<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nordic Herb Studio | 北歐香草工坊</title>
    <style>
        :root {
            --primary-green: #3a5a40;
            --accent-green: #588157;
            --light-green: #a3b18a;
            --warm-cream: #f4f1de;
            --soft-white: rgba(255, 255, 255, 0.95);
            --dark-text: #2f3e46;
            --accent-orange: #d96b43;
            --purple-bg: #f3effa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            color: var(--dark-text);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 縱向淺色木紋背景 */
        .wood-bg {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: url('https://images.unsplash.com/photo-1546484396-fb3fc6f95f98?auto=format&fit=crop&w=1920&q=80') center/cover repeat;
            transform: rotate(90deg);
            z-index: -2;
            opacity: 0.85;
        }

        /* 北歐手繪植物插圖 */
        .sketch-leaf {
            position: fixed;
            pointer-events: none;
            opacity: 0.2;
            z-index: -1;
        }
        .leaf-1 { top: 5%; left: 2%; width: 140px; }
        .leaf-2 { bottom: 10%; right: 3%; width: 160px; }
        .leaf-3 { top: 40%; right: 2%; width: 120px; }

        header {
            background-color: rgba(58, 90, 64, 0.92);
            color: #fff;
            padding: 1.5rem 2rem;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .header-title p {
            font-size: 0.9rem;
            color: var(--light-green);
        }

        /* 右上角購物車按鈕 (已移除圖示，名稱改為購物車) */
        .cart-btn-container {
            cursor: pointer;
            background: var(--accent-green);
            padding: 0.6rem 1.2rem;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            transition: background 0.2s;
        }

        .cart-btn-container:hover {
            background: var(--primary-green);
        }

        .cart-count {
            background: var(--accent-orange);
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 50%;
            padding: 2px 7px;
        }

        .container {
            max-width: 1280px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* 商品網格 */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: var(--soft-white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(163, 177, 138, 0.4);
            backdrop-filter: blur(8px);
        }

        /* 圖片僅展示，非按鈕 */
        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            pointer-events: none;
        }

        .product-info {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.2rem;
            color: var(--primary-green);
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .product-short-desc {
            font-size: 0.88rem;
            color: #555;
            line-height: 1.5;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .price {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-green);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn-detail, .btn-add-cart {
            border: none;
            padding: 0.5rem 0.9rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-detail {
            background-color: #e2e8f0;
            color: #2f3e46;
        }

        .btn-add-cart {
            background-color: var(--accent-orange);
            color: white;
        }

        .btn-add-cart:hover { background-color: #b85431; }
        .btn-detail:hover { background-color: #cbd5e1; }

        /* 通用 Modal 彈窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 詳情 Modal */
        .modal-content-detail {
            background: #ffffff;
            width: 90%;
            max-width: 520px;
            max-height: 90vh;
            border-radius: 20px;
            overflow-y: auto;
            padding: 1.5rem;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            font-size: 1.8rem;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            z-index: 10;
        }

        .detail-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        .detail-header-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2d3748;
        }

        .detail-header-sub {
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 0.5rem;
        }

        .detail-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-orange);
            margin-bottom: 1rem;
        }

        /* 3 個微型資訊卡塊 */
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 1.2rem;
        }

        .meta-card {
            border: 1px solid #d2ddcd;
            background: #f7faf7;
            border-radius: 10px;
            padding: 0.6rem 0.3rem;
            text-align: center;
            font-size: 0.78rem;
            color: #3b5240;
        }

        .meta-card .icon {
            display: block;
            font-size: 1rem;
            margin-bottom: 2px;
        }

        /* 詳細介紹卡片 */
        .desc-box {
            border: 1px solid #d2ddcd;
            background: #fcfdfc;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.2rem;
        }

        .desc-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: #2f4836;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .desc-text {
            font-size: 0.88rem;
            line-height: 1.6;
            color: #4a5568;
            white-space: pre-line;
        }

        .btn-add-cart-large {
            width: 100%;
            background: var(--accent-orange);
            color: white;
            padding: 0.85rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-add-cart-large:hover {
            background: #b85431;
        }

        /* 購物車側邊 Drawer - 已將背景改為淡紫色 (var(--purple-bg)) */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100%;
            background: var(--purple-bg);
            box-shadow: -5px 0 25px rgba(0,0,0,0.15);
            z-index: 1001;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            border-left: 2px solid #dcd0f0;
        }

        .cart-drawer.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--light-green);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.9);
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid #e2d9f3;
        }

        .cart-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
        }

        .cart-item-details { flex-grow: 1; }
        .cart-item-title { font-size: 0.9rem; font-weight: bold; color: var(--primary-green); }
        .cart-item-price { font-size: 0.85rem; color: #666; }
        .cart-item-qty { display: flex; align-items: center; gap: 5px; margin-top: 5px; }

        .qty-btn {
            background: var(--light-green);
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 4px;
            cursor: pointer;
            color: #ffffff;
            font-weight: bold;
        }

        .cart-footer {
            border-top: 2px solid var(--light-green);
            padding-top: 1rem;
            margin-top: 1rem;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .btn-checkout {
            width: 100%;
            background: var(--primary-green);
            color: white;
            padding: 0.8rem;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-checkout:hover {
            background: var(--accent-green);
        }

        /* 結帳付費彈窗 - 背景淡紫色設定 */
        .modal-content-checkout {
            background: var(--purple-bg);
            width: 90%;
            max-width: 500px;
            max-height: 88vh;
            border-radius: 20px;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            border: 2px solid #dcd0f0;
        }

        .checkout-form label {
            display: block;
            margin-top: 0.8rem;
            font-size: 0.88rem;
            font-weight: bold;
            color: #4a3e56;
        }

        .checkout-form input, .checkout-form select {
            width: 100%;
            padding: 0.65rem;
            margin-top: 0.3rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #ffffff;
        }

        .btn-pay {
            width: 100%;
            background: #7e57c2;
            color: white;
            padding: 0.85rem;
            border: none;
            border-radius: 25px;
            font-size: 1.05rem;
            font-weight: bold;
            margin-top: 1.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-pay:hover {
            background: #673ab7;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: rgba(58, 90, 64, 0.95);
            color: #fff;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <div class="wood-bg"></div>

    <!-- 背景手繪植物 SVG -->
    <svg class="sketch-leaf leaf-1" viewBox="0 0 100 100">
        <path d="M50,10 Q65,30 50,90 Q35,30 50,10 M50,10 L50,90 M50,30 L70,20 M50,50 L30,40 M50,70 L68,60" stroke="#3a5a40" stroke-width="2" fill="none"/>
    </svg>
    <svg class="sketch-leaf leaf-2" viewBox="0 0 100 100">
        <path d="M20,80 C40,20 80,20 80,80 C50,50 20,80 20,80 Z" stroke="#3a5a40" stroke-width="2" fill="none"/>
    </svg>
    <svg class="sketch-leaf leaf-3" viewBox="0 0 100 100">
        <path d="M10,50 Q40,10 90,50 Q40,90 10,50 M10,50 L90,50" stroke="#3a5a40" stroke-width="2" fill="none"/>
    </svg>

    <header>
        <div class="header-title">
            <h1>Nordic Herb Studio</h1>
            <p>北歐植物工坊 ‧ 30種純淨嚴選香草品種</p>
        </div>
        <!-- 右上角改為單純名稱「購物車」，並保留數量標籤 -->
        <div class="cart-btn-container" onclick="toggleCart()">
            <span>購物車</span>
            <span class="cart-count" id="cartCount">0</span>
        </div>
    </header>

    <div class="container">
        <div class="product-grid" id="productGrid"></div>
    </div>

    <!-- 商品詳情 Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content-detail">
            <button class="close-btn" onclick="closeModal('detailModal')">&times;</button>
            <img src="" alt="" class="detail-img" id="modalImg">
            
            <div class="detail-header-title" id="modalTitle"></div>
            <div class="detail-header-sub" id="modalSubTitle"></div>
            <div class="detail-price" id="modalPrice"></div>

            <div class="meta-grid">
                <div class="meta-card">
                    <span class="icon">⚙️</span>
                    <span id="modalSun">日照：全日照</span>
                </div>
                <div class="meta-card">
                    <span class="icon">💧</span>
                    <span id="modalWater">水分：乾燥澆透</span>
                </div>
                <div class="meta-card">
                    <span class="icon">🌱</span>
                    <span id="modalLevel">難易度：簡單新手</span>
                </div>
            </div>

            <div class="desc-box">
                <div class="desc-title">☘️ 詳細植物介紹</div>
                <div class="desc-text" id="modalDesc"></div>
            </div>

            <button class="btn-add-cart-large" id="modalAddCartBtn">
                加入購物車
            </button>
        </div>
    </div>

    <!-- 購物車 Drawer (背景已調為淡紫色) -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h2>您的購物車</h2>
            <button class="close-btn" style="position:static;" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>總計金額：</span>
                <span id="cartTotal">NT$ 0</span>
            </div>
            <button class="btn-checkout" onclick="openCheckout()">前往結帳</button>
        </div>
    </div>

    <!-- 結帳 Modal -->
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal-content-checkout">
            <button class="close-btn" onclick="closeModal('checkoutModal')">&times;</button>
            <h2 style="color: #4a3e56; margin-bottom:0.5rem; text-align:center;">💳 結帳與付款資訊</h2>
            <p style="font-size:0.85rem; color:#6b5b7b; text-align:center; margin-bottom:1.2rem;">請確認您的訂單內容並完成付款手續</p>
            
            <form class="checkout-form" onsubmit="processPayment(event)">
                <label>收件人姓名</label>
                <input type="text" required placeholder="請輸入姓名">
                <label>聯絡電話</label>
                <input type="tel" required placeholder="0912-345-678">
                <label>配送地址</label>
                <input type="text" required placeholder="請輸入完整的收件地址">
                <label>選擇付款方式</label>
                <select>
                    <option value="credit">信用卡 / 金融卡線上付款</option>
                    <option value="linepay">LINE Pay 快速支付</option>
                    <option value="cod">超商取貨付款</option>
                </select>
                <label>卡號 (模擬支付測試)</label>
                <input type="text" placeholder="**** - **** - **** - ****">
                <button type="submit" class="btn-pay">確認支付並完成訂單</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Nordic Herb Studio. All rights reserved.</p>
    </footer>

    <script>
        // 30項真實香草資料
        const products = [
            {
                id: 1, name: "甜墨角蘭 (瑪鬱蘭)", latin: "Origanum majorana · 料理香草", price: 260,
                sun: "日照：全日照", water: "水分：乾燥澆透", level: "難易度：簡單新手",
                img: "https://images.unsplash.com/photo-1515586000433-45406d8e6662?auto=format&fit=crop&w=600&q=80",
                shortDesc: "墨角蘭比起牛至擁有更為溫和甜蜜、帶有淡淡柑橘與花香的香氣。是法式與德式傳統料理中的精緻調味靈魂。",
                fullDesc: "墨角蘭比起牛至擁有更為溫和甜蜜、帶有淡淡柑橘與花香的香氣。是法式與德式傳統香腸、肉醬與蔬菜濃湯中的精緻調味靈魂。柔軟撫媚的植株型態與柔和香氣，能為家庭料理帶來優雅豐富的層次感。\n\n【栽培與應用】甜墨角蘭喜好溫暖且陽光充足的環境，排水良好的土壤是生長關鍵。在烹飪應用上，因其香味較為細緻，建議在料理即將起鍋前加入，能完美保留其溫柔柑橘與甜蜜花草香。乾燥後的墨角蘭亦常用於調配西式複合香草鹽，或作為夜晚舒壓茶飲。"
            },
            {
                id: 2, name: "甜羅勒 (Sweet Basil)", latin: "Ocimum basilicum · 料理香草", price: 190,
                sun: "日照：全日照", water: "水分：保持濕潤", level: "難易度：簡單新手",
                img: "https://images.unsplash.com/photo-1618164436241-4473940d1f5c?auto=format&fit=crop&w=600&q=80",
                shortDesc: "義式料理靈魂夥伴，葉片柔軟寬大，富含甜美茴香與溫和丁香香氣，是製作正宗義大利青醬的核心主角。",
                fullDesc: "甜羅勒是地中海飲食文化中最具代表性的香草之一。與台式九層塔相比，甜羅勒的葉片更為柔軟寬大，風味溫柔甜美，帶有淡淡的茴香與丁香氣息，完全不帶嗆辣感。\n\n【栽培與應用】極度喜好陽光與高溫環境，適合春夏生長。土壤保持微濕但不積水即可蓬勃發展。甜羅勒是製作經典熱那亞青醬（Pesto）的主要原料，只需將鮮採葉片與松子、蒜頭、帕馬森起司及橄欖油打碎即可。與鮮採蕃茄、起司片搭配製作莫札瑞拉沙拉也是絕配。"
            },
            {
                id: 3, name: "胡椒薄荷 (Peppermint)", latin: "Mentha × piperita · 茶飲/藥用", price: 180,
                sun: "日照：半日照", water: "水分：水分充足", level: "難易度：極易上手",
                img: "https://images.unsplash.com/photo-1628556270448-4d4e4148e1b1?auto=format&fit=crop&w=600&q=80",
                shortDesc: "含有高濃度薄荷腦，口感極致涼爽清冽。非常適合調製夏日冰飲、調酒、甜點裝飾與幫助舒緩消化不適。",
                fullDesc: "胡椒薄荷為水薄荷與綠薄荷雜交的多年生草本植物，具有強烈清涼香氣與微微辛辣後味。其高含量的薄荷腦成分使其成為全世界最受歡迎的舒緩香草。\n\n【栽培與應用】生命力極強，喜歡半日照與濕潤環境。由於根系擴展迅速，建議獨立盆栽種植。摘採新鮮葉片沖泡熱水或冰鎮飲用，能快速提神醒腦並舒緩消化負擔。亦非常適合用於製作Mojito調酒、薄荷巧克力甜點裝飾或檸檬氣泡水。"
            },
            {

            { name: "西洋菜 / 水芥菜 (Watercress)", latin: "Nasturtium officinale", price: 190, img: "https://images.unsplash.com/photo-1589707223376-78c7b805c87e?auto=format&fit=crop&w=600&q=80", desc: "口感爽脆，帶有天然哇沙米般的微辣刺激感，富含營養，適合做濃湯與沙拉。" },
            { name: "琉璃苣 (Borage)", latin: "Borago officinalis", price: 260, img: "https://images.unsplash.com/photo-1528183429752-a97d0bf99b5a?auto=format&fit=crop&w=600&q=80", desc: "開出絕美星形藍色小花，葉片與花朵皆帶有黃瓜般的清爽口感，可用於調酒凍結晶。" },
            { name: "金盞花 (Calendula)", latin: "Calendula officinalis", price: 210, img: "https://images.unsplash.com/photo-1589707223376-78c7b805c87e?auto=format&fit=crop&w=600&q=80", desc: "金黃色的花瓣富含葉黃素，可用於料理染色、泡茶或製作天然舒緩肌膚膏。" },
            { name: "神香草 (Hyssop)", latin: "Hyssopus officinalis", price: 250, img: "https://images.unsplash.com/photo-1591857177580-dc82b9ac4e1e?auto=format&fit=crop&w=600&q=80", desc: "古老歷史的淨化香草，開藍紫色花穗，帶有薄荷與薄荷樟腦氣息，適合燉菜調味。" },
            { name: "甜葉菊 (Stevia)", latin: "Stevia rebaudiana", price: 200, img: "https://images.unsplash.com/photo-1515586000433-45406d8e6662?auto=format&fit=crop&w=600&q=80", desc: "天然無熱量甜味劑，葉片甜度為蔗糖的數十倍，摘採一片放入花草茶中即可天然提甜。" }
        ];

        extraHerbs.forEach((item, idx) => {
            products.push({
                id: 16 + idx,
                name: item.name,
                latin: `${item.latin} · 特選香草`,
                price: item.price,
                sun: "日照：全日照",
                water: "水分：適中澆透",
                level: "難易度：簡單新手",
                img: item.img,
                shortDesc: item.desc,
                fullDesc: `${item.desc}\n\n【栽培與應用】本品種植株於北歐有機栽培體系中長成，具備絕佳適應力與濃郁天然揮發油。適合放置於陽台、廚房窗台等通風良好的環境。生長期間按時補充水分與充沛陽光，即可定時採收新鮮葉片用於各類家庭料理、手作點心、芳香調飲或居家綠化擺設，為生活注入豐富的自然綠意與健康風味。`
            });
        });

        let cart = [];

        // 渲染商品列表
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.img}" alt="${p.name}" class="product-img" loading="lazy">
                    <div class="product-info">
                        <div class="product-title">${p.name}</div>
                        <div class="product-short-desc">${p.shortDesc}</div>
                        <div class="product-bottom">
                            <span class="price">NT$ ${p.price}</span>
                            <div class="btn-group">
                                <button class="btn-detail" onclick="openDetail(${p.id})">詳情</button>
                                <button class="btn-add-cart" onclick="addToCart(${p.id})">+購物車</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 開啟詳情 Modal
        function openDetail(id) {
            const p = products.find(prod => prod.id === id);
            if (!p) return;

            document.getElementById('modalImg').src = p.img;
            document.getElementById('modalTitle').innerText = p.name;
            document.getElementById('modalSubTitle').innerText = p.latin;
            document.getElementById('modalPrice').innerText = `NT$ ${p.price}`;
            document.getElementById('modalSun').innerText = p.sun;
            document.getElementById('modalWater').innerText = p.water;
            document.getElementById('modalLevel').innerText = p.level;
            document.getElementById('modalDesc').innerText = p.fullDesc;

            const addBtn = document.getElementById('modalAddCartBtn');
            addBtn.innerHTML = `加入購物車 (NT$ ${p.price})`;
            addBtn.onclick = () => {
                addToCart(p.id);
                closeModal('detailModal');
            };

            document.getElementById('detailModal').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('open');
        }

        function addToCart(id) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty++;
            } else {
                const product = products.find(p => p.id === id);
                cart.push({ ...product, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cartItems');
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');

            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            cartCount.innerText = totalQty;
            cartTotal.innerText = `NT$ ${totalPrice}`;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="text-align:center; color:#888; margin-top:2rem;">您的購物車目前是空的</p>';
                return;
            }

            cartItemsContainer.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <img src="${item.img}" alt="${item.name}">
                    <div class="cart-item-details">
                        <div class="cart-item-title">${item.name}</div>
                        <div class="cart-item-price">NT$ ${item.price}</div>
                        <div class="cart-item-qty">
                            <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;

            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            updateCartUI();
        }

        function openCheckout() {
            if (cart.length === 0) {
                alert("您的購物車是空的！");
                return;
            }
            toggleCart();
            document.getElementById('checkoutModal').classList.add('active');
        }

        function processPayment(e) {
            e.preventDefault();
            alert("感謝您的訂購！訂單已成功送出，我們將盡快為您安排香草植栽配送。");
            cart = [];
            updateCartUI();
            closeModal('checkoutModal');
        }

        window.onload = renderProducts;
    </script>
</body>
</html>
